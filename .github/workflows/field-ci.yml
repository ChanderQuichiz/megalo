on:
  pull_request:
    branches: [main]
    paths:
      - 'field/**'
  push:
    branches: [main]
    paths:
      - 'field/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: field

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: field/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint code
        run: npm run lint
        
      - name: Verify build
        run: npm run build
        
      - name: Run unit tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e